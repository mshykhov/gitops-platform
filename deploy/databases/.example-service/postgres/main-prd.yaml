# =============================================================================
# PRD ENVIRONMENT - PostgreSQL
# =============================================================================
cluster:
  instances: 2

  storage:
    size: 10Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

backups:
  # Set true only after global.components.cnpgBackups and S3 credentials are ready.
  enabled: false
