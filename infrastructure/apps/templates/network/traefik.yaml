# =============================================================================
# TRAEFIK INGRESS CONTROLLER
# =============================================================================
# ClusterIP edge used by Cloudflare Tunnel and Tailscale ingress proxies.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: network
  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: "41.1.0"
      helm:
        valueFiles:
          - $values/infrastructure/helm-values/network/traefik.yaml
    - repoURL: {{ .Values.spec.source.repoURL }}
      targetRevision: {{ .Values.spec.source.targetRevision }}
      ref: values
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        tier: network
        team: platform
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
