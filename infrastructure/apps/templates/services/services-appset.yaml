# =============================================================================
# APPLICATIONSET - FILE-DRIVEN SERVICE ENVIRONMENTS
# =============================================================================
# deploy/services/<name>/values-<env>.yaml exists <=> Application <name>-<env>.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "100"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: {{ .Values.deploy.repoURL }}
        revision: {{ .Values.deploy.targetRevision }}
        files:
          - path: deploy/services/*/values-*.yaml
          - path: deploy/services/_*/values-*.yaml
            exclude: true
          - path: deploy/services/.*/values-*.yaml
            exclude: true
  template:
    metadata:
      name: '{{`{{ .path.basename }}`}}-{{`{{ trimSuffix ".yaml" (trimPrefix "values-" .path.filename) }}`}}'
      labels:
        app: '{{`{{ .path.basename }}`}}'
        env: '{{`{{ trimSuffix ".yaml" (trimPrefix "values-" .path.filename) }}`}}'
        deploy-notify: "true"
    spec:
      project: applications
      source:
        repoURL: {{ .Values.deploy.repoURL }}
        targetRevision: {{ .Values.deploy.targetRevision }}
        path: '{{`{{ .path.path }}`}}'
        helm:
          valueFiles:
            - values.yaml
            - '{{`{{ .path.filename }}`}}'
          valuesObject:
            imagePullSecrets:
              - name: dockerhub-credentials
      destination:
        server: {{ .Values.spec.destination.server }}
        namespace: '{{`{{ .path.basename }}`}}-{{`{{ trimSuffix ".yaml" (trimPrefix "values-" .path.filename) }}`}}'
      ignoreDifferences:
        - group: external-secrets.io
          kind: ExternalSecret
          jqPathExpressions:
            - .spec.data[].remoteRef.conversionStrategy
            - .spec.data[].remoteRef.decodingStrategy
            - .spec.data[].remoteRef.metadataPolicy
            - .spec.target.deletionPolicy
      syncPolicy:
        automated:
          prune: true
          selfHeal: false
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        managedNamespaceMetadata:
          labels:
            app: '{{`{{ .path.basename }}`}}'
            env: '{{`{{ trimSuffix ".yaml" (trimPrefix "values-" .path.filename) }}`}}'
            tier: application
            team: backend
            dockerhub-pull: "true"
        syncOptions:
          - CreateNamespace=true
