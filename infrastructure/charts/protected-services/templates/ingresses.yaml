{{- range $name, $service := .Values.services }}
{{- if $service.enabled }}
---
{{- $publicHost := "" }}
{{- if hasKey $service "subdomain" }}
  {{- if eq $service.subdomain "" }}
    {{- $publicHost = $.Values.global.domain }}
  {{- else }}
    {{- $publicHost = printf "%s.%s" $service.subdomain $.Values.global.domain }}
  {{- end }}
{{- else if $service.hostname }}
  {{- $publicHost = $service.hostname }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  namespace: {{ $service.namespace }}
  annotations:
    {{- if $publicHost }}
    external-dns.alpha.kubernetes.io/hostname: {{ $publicHost }}
    external-dns.alpha.kubernetes.io/target: {{ $.Values.global.cloudflare.tunnelId }}.cfargotunnel.com
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    {{- end }}
    {{- if $service.forwardAuth }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ $service.namespace }}-authentik-auth@kubernetescrd
    {{- end }}
    {{- if $service.backend.protocol }}
    traefik.ingress.kubernetes.io/service.serversscheme: {{ lower $service.backend.protocol | quote }}
    {{- end }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ if $publicHost }}{{ $publicHost }}{{ else }}{{ $name }}.{{ $.Values.global.tailnet }}.ts.net{{ end }}
      http:
        paths:
          - path: {{ $service.path | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ $service.backend.name }}
                port:
                  number: {{ $service.backend.port }}
{{- if $service.forwardAuth }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}-logout
  namespace: {{ $service.namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ $service.namespace }}-logout-{{ $name }}@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "200"
spec:
  ingressClassName: traefik
  rules:
    - host: {{ if $publicHost }}{{ $publicHost }}{{ else }}{{ $name }}.{{ $.Values.global.tailnet }}.ts.net{{ end }}
      http:
        paths:
          - path: /logout
            pathType: Exact
            backend:
              service:
                name: authentik-outpost
                port:
                  number: 80
{{- end }}
{{- end }}
{{- end }}
