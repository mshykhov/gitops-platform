# =============================================================================
# PROTECTED SERVICES - Ingress Configuration
# =============================================================================
# Service parameters:
#   enabled: bool       - enable/disable ingress
#   namespace: string   - target namespace
#   subdomain: string   - public subdomain (enables Cloudflare + External-DNS)
#   path: string        - ingress path (default: /)
#   forwardAuth: bool   - enable Authentik ForwardAuth
#   backend.name: str   - service name
#   backend.port: int   - service port
#   backend.protocol: str - backend protocol (optional, e.g. HTTPS)
#
# Routing:
#   - With subdomain: public via Cloudflare Tunnel ({subdomain}.{global.domain})
#   - Without subdomain: private via Tailscale ({name}.{tailnet}.ts.net)
# =============================================================================

# cloudflare.tunnelId comes from global values

authentik:
  serviceUrl: "http://authentik-server.authentik.svc.cluster.local:80"
  authResponseHeaders: "X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid"

services:
  # ---------------------------------------------------------------------------
  # Infrastructure services start disabled. Enable only after creating an
  # Authentik proxy provider and outpost for the service.
  # ---------------------------------------------------------------------------
  argocd:
    enabled: false
    namespace: argocd
    forwardAuth: true
    backend:
      name: argocd-server
      port: 80

  longhorn:
    enabled: false
    namespace: longhorn-system
    forwardAuth: true
    backend:
      name: longhorn-frontend
      port: 80

  grafana:
    enabled: false
    namespace: monitoring
    forwardAuth: true
    backend:
      name: victoria-metrics-k8s-stack-grafana
      port: 80

  authentik:
    enabled: false
    namespace: authentik
    forwardAuth: false
    subdomain: auth
    backend:
      name: authentik-server
      port: 80

  # ---------------------------------------------------------------------------
  # Application Services - ADD YOUR SERVICES HERE
  # ---------------------------------------------------------------------------
  # Example: DEV environment - Tailscale only (no subdomain = private)
  # <SERVICE_NAME>-dev:
  #   enabled: true
  #   forwardAuth: false
  #   namespace: <SERVICE_NAME>-dev
  #   backend:
  #     name: <SERVICE_NAME>-dev
  #     port: 8080

  # Example: PRD environment - Public API via Cloudflare (subdomain = public)
  # <SERVICE_NAME>-prd:
  #   enabled: true
  #   forwardAuth: false
  #   subdomain: api                          # api.{global.domain}
  #   namespace: <SERVICE_NAME>-prd
  #   backend:
  #     name: <SERVICE_NAME>-prd
  #     port: 8080

  # Example: PRD environment - Public UI on root domain
  # <SERVICE_NAME>-ui-prd:
  #   enabled: true
  #   forwardAuth: false
  #   subdomain: ""                           # {global.domain} (root)
  #   namespace: <SERVICE_NAME>-ui-prd
  #   backend:
  #     name: <SERVICE_NAME>-ui-prd
  #     port: 8080
